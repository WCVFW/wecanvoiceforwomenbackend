name: Deploy Spring Boot to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build Spring Boot App
        run: mvn clean package -DskipTests

      - name: 📦 List JAR Files
        run: ls -lah wecanvoiceforwomenbackend/target

      - name: 🚀 Upload JAR to EC2 Instance
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "wecanvoiceforwomenbackend/target/*.jar"
          target: "/home/ubuntu/wecanvoiceforwomenbackend/"

      - name: 🔁 Restart Spring Boot App on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "📁 Navigating to backend folder"
            cd /home/ubuntu/wecanvoiceforwomenbackend

            echo "🔁 Renaming latest JAR to myapp.jar"
            JAR=$(ls target/*.jar | head -n 1)
            cp "$JAR" myapp.jar

            echo "🧹 Removing old log"
            rm -f myapp.log

            echo "🚀 Restarting Spring Boot systemd service"
            sudo systemctl daemon-reexec
            sudo systemctl restart myapp
            sudo systemctl status myapp --no-pager
