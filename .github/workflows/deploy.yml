name: 🚀 Deploy Spring Boot Backend to EC2

on:
  push:
    branches: [main]  # Trigger deployment on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build Spring Boot App
        run: mvn clean package -DskipTests

      - name: 📁 List built JAR
        run: ls -lah target

      - name: 🚀 Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "target/womens-foundation-backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"

      - name: 🧠 Rename & Restart Backend on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "🔁 Renaming JAR to myapp.jar"
            mv /home/ubuntu/womens-foundation-backend-0.0.1-SNAPSHOT.jar /home/ubuntu/myapp.jar

            echo "🧹 Cleaning old logs"
            rm -f /home/ubuntu/app.log

            echo "🚀 Restarting backend service"
            sudo systemctl daemon-reexec
            sudo systemctl daemon-reload
            sudo systemctl restart myapp

            echo "✅ Spring Boot backend deployed!"
