name: 🚀 Deploy Spring Boot Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Build Spring Boot App
        working-directory: wecanvoiceforwomenbackend
        run: mvn clean package -DskipTests

      - name: 📦 List JAR Files
        run: ls -lah wecanvoiceforwomenbackend/target

      - name: 🚀 Upload JAR to EC2 Instance
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "wecanvoiceforwomenbackend/target/*.jar"
          target: "/home/ubuntu/"

      - name: 🔁 SSH to Restart Spring Boot on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "🔁 Renaming latest JAR to myapp.jar"
            JAR=$(ls /home/ubuntu/*.jar | grep -v myapp.jar | head -n 1)
            mv "$JAR" /home/ubuntu/myapp.jar

            echo "🧹 Clean old log if exists"
            rm -f /home/ubuntu/myapp.log

            echo "🚀 Restart Spring Boot service"
            sudo systemctl daemon-reexec
            sudo systemctl restart myapp
            sudo systemctl status myapp --no-pager
