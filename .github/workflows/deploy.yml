name: 🚀 Deploy Spring Boot Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build Spring Boot App
        working-directory: wecanvoiceforwomenbackend
        run: mvn clean package -DskipTests

      - name: 📦 List JAR File
        run: ls -lah wecanvoiceforwomenbackend/target

      - name: 🚀 Upload JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "wecanvoiceforwomenbackend/target/womens-foundation-backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"

      - name: 🔁 Restart Spring Boot Service on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "🔁 Moving JAR to myapp.jar"
            mv /home/ubuntu/womens-foundation-backend-0.0.1-SNAPSHOT.jar /home/ubuntu/myapp.jar

            echo "🧹 Removing old log if exists"
            rm -f /home/ubuntu/myapp.log

            echo "🚀 Restarting Spring Boot service"
            sudo systemctl daemon-reexec
            sudo systemctl restart myapp
            sudo systemctl status myapp --no-pager
