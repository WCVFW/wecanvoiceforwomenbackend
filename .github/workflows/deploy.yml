name: Deploy Spring Boot to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build Spring Boot App
        run: mvn clean package -DskipTests
        working-directory: wecanvoiceforwomenbackend  # ✅ Correct this line

      - name: 📦 List JAR Files
        run: ls -lah wecanvoiceforwomenbackend/target

      - name: 🚀 Upload JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "wecanvoiceforwomenbackend/target/*.jar"
          target: "/home/ubuntu/"

      - name: 🔁 Restart Spring Boot App on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "📦 Rename latest JAR to myapp.jar"
            LATEST_JAR=$(ls /home/ubuntu/*.jar | grep -v myapp.jar | head -n 1)
            mv "$LATEST_JAR" /home/ubuntu/myapp.jar

            echo "🧹 Clean old log"
            rm -f /home/ubuntu/myapp.log

            echo "🔁 Restart myapp service"
            sudo systemctl daemon-reexec
            sudo systemctl restart myapp
            sudo systemctl status myapp --no-pager
