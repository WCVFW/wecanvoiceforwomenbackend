name: 🚀 Deploy Spring Boot to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v3

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build project with Maven
        run: mvn clean package -DskipTests

      - name: 📦 Show built JAR
        run: ls -lh target/*.jar

      - name: 🚀 Upload JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "target/*.jar"
          target: "/home/ubuntu"

      - name: 🔁 Restart Spring Boot service on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "Renaming latest JAR to myapp.jar"
            LATEST_JAR=$(ls /home/ubuntu/*.jar | grep -v myapp.jar | tail -n1)
            mv "$LATEST_JAR" /home/ubuntu/myapp.jar

            echo "Cleaning previous logs"
            rm -f /home/ubuntu/myapp.log

            echo "Reloading and restarting backend service"
            sudo systemctl daemon-reexec
            sudo systemctl daemon-reload
            sudo systemctl restart myapp

            echo "✅ Backend deployment complete!"
