name: Deploy Spring Boot Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v3

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build Spring Boot JAR
        working-directory: ./wecanvoiceforwomenbackend
        run: mvn clean package -DskipTests

      - name: 📦 List JAR files
        working-directory: ./wecanvoiceforwomenbackend/target
        run: ls -lah

      - name: 📤 Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "wecanvoiceforwomenbackend/target/*.jar"
          target: "/home/ubuntu/"

      - name: 🚀 Restart Spring Boot Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "🔁 Renaming latest JAR to myapp.jar"
            JAR=$(ls /home/ubuntu/*.jar | grep -v myapp.jar | head -n 1)
            mv "$JAR" /home/ubuntu/myapp.jar

            echo "🧹 Clean old log"
            rm -f /home/ubuntu/myapp.log

            echo "🔄 Restarting systemd service"
            sudo systemctl daemon-reexec
            sudo systemctl restart myapp
            sudo systemctl status myapp --no-pager
