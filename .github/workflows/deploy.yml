name: Deploy Spring Boot to EC2

on:
  push:
    branches: [main]  # Trigger on main branch push

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: 📦 List JAR Files
        run: ls -lah target

      - name: 🚀 Upload JAR to EC2 Instance
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "target/*.jar"
          target: "/home/ubuntu/"

      - name: 🧠 SSH to EC2 and Restart Spring Boot App
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "🔁 Rename latest JAR to myapp.jar"
            JAR=$(ls /home/ubuntu/*.jar | grep -v myapp.jar | head -n 1)
            mv "$JAR" /home/ubuntu/myapp.jar

            echo "🧹 Clean old log if exists"
            rm -f /home/ubuntu/myapp.log

            echo "🚀 Restarting Spring Boot systemd service"
            sudo systemctl daemon-reexec
            sudo systemctl restart myapp
            sudo systemctl status myapp --no-pager
